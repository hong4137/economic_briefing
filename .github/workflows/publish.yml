# 경제 브리핑 조판 — 편집본(editions/*.json)이 올라오면 수집된 가격과 합쳐 docs/ 를 만든다. AI 없음.
name: publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["editions/**", "build.py", "template.html", ".github/workflows/publish.yml"]
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 수집 자료 가져오기
        run: |
          git fetch --depth 1 origin data
          mkdir -p data && git show FETCH_HEAD:raw.json > data/raw.json
      - run: python build.py
      - name: 사이트 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -q -m "조판 $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull -q --rebase origin main
          git push
