# 아침 한 장 — 모의투자의 모든 선수가 똑같이 읽는 사실 모음. AI 없음. 결과는 data 가지의 library/아침-한-장/ 에 둔다.
# GitHub 예약은 몇 시간씩 밀리므로 밖(GAS 예약)에서 workflow_dispatch 로 깨운다. 시장은 깨어난 시각(서울)으로 정한다.
name: brief
on:
  workflow_dispatch:
    inputs:
      market:
        description: "KR · US · WEEK (비우면 시각으로 정한다: 일요일=WEEK, 낮 12시 전=KR, 그 뒤=US)"
        default: ""
  push:
    branches: [main]
    paths: ["desk/**", ".github/workflows/brief.yml"]
permissions:
  contents: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: data 가지 가져오기
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C data
          fi
          mkdir -p data/library
          cp -r desk/library-in/. data/library/
      - name: 한 장 만들기
        env:
          DESK_CONFIG: config.cloud.json
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          M="${{ github.event.inputs.market }}"
          if [ -z "$M" ]; then
            if [ "$(TZ=Asia/Seoul date +%u)" = "7" ]; then M=WEEK; elif [ "$(TZ=Asia/Seoul date +%H)" -lt 12 ]; then M=KR; else M=US; fi
          fi
          echo "시장: $M"
          python desk/desk.py brief --market "$M"
          find data/library/아침-한-장 -name "20*.md" -mtime +45 -delete || true
      - name: data 가지에 남기기
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "아침 한 장 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
